services:
  backend:
    restart: unless-stopped
    container_name: nlp-sentiment-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DEFAULT_THRESHOLD: ${APP_DEFAULT_THRESHOLD:-0.6}
      APP_ALLOW_ORIGINS: ${APP_ALLOW_ORIGINS:-http://8.152.168.40,http://localhost,http://127.0.0.1}
      APP_MODEL_DIR: /app/model_group_a_no_cnn
      APP_BERT_DIR: /app/bert-base-chinese
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    volumes:
      - ./model_group_a_no_cnn:/app/model_group_a_no_cnn:ro
      - ./bert-base-chinese:/app/bert-base-chinese:ro
      - ./backend:/app/backend

  frontend:
    restart: unless-stopped
    container_name: nlp-sentiment-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend:/app/frontend



